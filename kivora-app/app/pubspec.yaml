name: kivora_app
description: "Kivora Mobile Application for Members and Branch Managers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend & State
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Verification & Device Services
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.3

  # UI, Icons & Formatting
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
